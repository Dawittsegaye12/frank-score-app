{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Login</h1>
  <p class="muted">Sign in to access your assessment</p>

  <form id="loginForm" class="form">
    <label>
      Username
      <input name="username" type="text" required autocomplete="username" />
    </label>

    <label>
      Password
      <input name="password" type="password" required autocomplete="current-password" />
    </label>

    <div class="row">
      <button id="loginBtn" class="btn primary" type="submit">Login</button>
      <div id="err" class="error" aria-live="polite"></div>
    </div>
  </form>

  <div style="margin-top: 1.5rem; text-align: center;">
    <p class="muted">Don't have an account? <a href="/signup">Sign up</a></p>
  </div>
</div>

<script>
  const form = document.getElementById("loginForm");
  const err = document.getElementById("err");
  const btn = document.getElementById("loginBtn");

  function setErr(msg) {
    err.textContent = msg || "";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    setErr("");
    btn.disabled = true;
    btn.textContent = "Logging in...";

    const fd = new FormData(form);
    const payload = {
      username: fd.get("username"),
      password: fd.get("password")
    };

    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const data = await res.json().catch(() => ({ detail: "Login failed" }));
        throw new Error(data.detail || "Login failed");
      }

      const data = await res.json();
      
      // Store user info in sessionStorage
      sessionStorage.setItem("fs_user_id", String(data.user_id));
      sessionStorage.setItem("fs_username", data.username);

      // Redirect to terms page
      window.location.href = `/terms?user_id=${data.user_id}`;
    } catch (e) {
      setErr(String(e && e.message ? e.message : e));
    } finally {
      btn.disabled = false;
      btn.textContent = "Login";
    }
  });
</script>
{% endblock %}

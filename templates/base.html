<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title if title else "FrankScore - Psychometric Assessment" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}" />
    <style>
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      main {
        animation: fadeInUp 0.6s ease-out;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <div class="brand">FrankScore</div>
        <nav class="nav">
          <a href="/terms">Start</a>
          <a href="/health" target="_blank" rel="noreferrer">Health</a>
        </nav>
      </div>
    </header>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <footer class="footer container">
      <div class="muted">Demo-only. Data stored locally in SQLite.</div>
    </footer>
  </body>
</html>

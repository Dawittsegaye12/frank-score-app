<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrankScore Bank Dashboard</title>
    <!-- Use existing styles or minimal Tailwind/Bootstrap CDN for MVP -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .score-card {
            transition: all 0.2s;
        }

        .score-card:hover {
            transform: translateY(-2px);
            shadow: lg;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800">
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center text-blue-600 font-bold text-xl">
                        FrankScore
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                        <a href="/bank/borrowers"
                            class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Borrowers</a>
                        <a href="/bank/portfolio"
                            class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Portfolio</a>
                    </div>
                </div>
                <div class="flex items-center">
                    <button onclick="logout()"
                        class="text-gray-500 hover:text-gray-700 text-sm font-medium">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>

    <script>
        function logout() {
            localStorage.removeItem('bank_token');
            window.location.href = '/bank/login';
        }

        // Simple auth check
        const token = localStorage.getItem('bank_token');
        if (!token && window.location.pathname !== '/bank/login') {
            window.location.href = '/bank/login';
        }
    </script>
    {% block scripts %}{% endblock %}
</body>

</html>
